# CI/CD (Fase 3 — walking skeleton):
#   verificar → toda mudança passa por tipos, fitness functions de arquitetura e testes.
#   deploy    → só na main, só se verificar passou: migrações D1, build web e publicação do Worker.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false # não interromper um deploy no meio

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # versão lida do campo "packageManager" do package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck (todos os pacotes)
        run: pnpm typecheck

      - name: Fitness functions de arquitetura (ADR-0009)
        run: pnpm lint:arch

      - name: Testes
        run: pnpm test

      # E2E do fluxo principal na build web real (Chrome do runner, sem sandbox de usuário).
      - name: E2E web
        env:
          NAVEGADOR: /usr/bin/google-chrome
          CI: '1'
        run: pnpm e2e:web

      - name: Screenshots do E2E (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: .e2e/
          retention-days: 7

      # ADR-0014: reprova só vulnerabilidades altas/críticas em dependências de produção.
      # (Moderadas em ferramentas de build são avaliadas manualmente; ver docs/architecture/06-seguranca-lgpd.md.)
      - name: Auditoria de dependências
        run: pnpm audit --prod --audit-level high

  deploy:
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: producao
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CI: '1'
    steps:
      - name: Token configurado?
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN não configurado — deploy ignorado."

      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: pnpm/action-setup@v4
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 26
          cache: pnpm

      - name: Instalar dependências
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm install --frozen-lockfile

      # Migrações ANTES do código novo: o código precisa encontrar o schema que espera.
      # Regra para migrações: sempre aditivas/compatíveis com a versão anterior do Worker (expand → contract).
      - name: Migrações D1 (identidade)
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply gym-identity --remote

      - name: Build web + deploy do Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm run deploy

      - name: Smoke test pós-deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        # A nova versão leva alguns segundos para propagar na borda: cada verificação tenta por até ~1 min.
        run: |
          B=https://gym-api.gym-api.workers.dev
          tentar() { for i in $(seq 1 10); do if eval "$1"; then echo "✓ $2"; return 0; fi; sleep 6; done; echo "✗ $2"; return 1; }
          tentar "curl -fsS $B/api/health > /dev/null" "health"
          tentar "test \"\$(curl -s -o /dev/null -w '%{http_code}' $B/)\" = 200" "web 200"
          tentar "test \"\$(curl -s -o /dev/null -w '%{http_code}' '$B/api/sync/pull?desde=0')\" = 401" "sync exige login"
          tentar "test \"\$(curl -s -o /dev/null -w '%{http_code}' $B/api/conta/exportar)\" = 401" "exportação exige login"
          tentar "curl -sI $B/ | grep -qi '^x-content-type-options: nosniff'" "cabeçalhos de segurança na web"
          tentar "curl -sI $B/api/health | grep -qi '^x-content-type-options: nosniff'" "cabeçalhos de segurança na API"
