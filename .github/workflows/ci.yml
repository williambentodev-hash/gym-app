# CI/CD (Fase 3 — walking skeleton):
#   verificar → toda mudança passa por tipos, fitness functions de arquitetura e testes.
#   deploy    → só na main, só se verificar passou: migrações D1, build web e publicação do Worker.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false # não interromper um deploy no meio

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # versão lida do campo "packageManager" do package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck (todos os pacotes)
        run: pnpm typecheck

      - name: Fitness functions de arquitetura (ADR-0009)
        run: pnpm lint:arch

      - name: Testes
        run: pnpm test

      # ADR-0014: reprova só vulnerabilidades altas/críticas em dependências de produção.
      # (Moderadas em ferramentas de build são avaliadas manualmente; ver docs/architecture/06-seguranca-lgpd.md.)
      - name: Auditoria de dependências
        run: pnpm audit --prod --audit-level high

  deploy:
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: producao
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CI: '1'
    steps:
      - name: Token configurado?
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN não configurado — deploy ignorado."

      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: pnpm/action-setup@v4
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 26
          cache: pnpm

      - name: Instalar dependências
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm install --frozen-lockfile

      # Migrações ANTES do código novo: o código precisa encontrar o schema que espera.
      # Regra para migrações: sempre aditivas/compatíveis com a versão anterior do Worker (expand → contract).
      - name: Migrações D1 (identidade)
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply gym-identity --remote

      - name: Build web + deploy do Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm run deploy

      - name: Smoke test pós-deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          curl -fsS https://gym-api.gym-api.workers.dev/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' https://gym-api.gym-api.workers.dev/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'https://gym-api.gym-api.workers.dev/api/sync/pull?desde=0')" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' https://gym-api.gym-api.workers.dev/api/conta/exportar)" = "401"
          curl -sI https://gym-api.gym-api.workers.dev/ | grep -qi '^x-content-type-options: nosniff'
          curl -sI https://gym-api.gym-api.workers.dev/api/health | grep -qi '^x-content-type-options: nosniff'
