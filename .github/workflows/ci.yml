# CI (Fase 3 — walking skeleton): toda mudança passa por tipos e fitness functions de arquitetura.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # versão lida do campo "packageManager" do package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck (todos os pacotes)
        run: pnpm typecheck

      - name: Fitness functions de arquitetura (ADR-0009)
        run: pnpm lint:arch

      - name: Testes
        run: pnpm test
